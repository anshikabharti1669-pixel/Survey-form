
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback Survey</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #283044;
            padding: 25px 15px;
        }

        .container {
            max-width: 750px;
            margin: 20px auto;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 22px rgba(35, 50, 80, 0.12);
        }

        .header {
            background: #293b63;
            color: white;
            padding: 32px 30px;
        }

        .header span {
            color: #a9c5ff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 {
            font-size: 30px;
            margin: 12px 0;
        }

        .header p {
            color: #d9e1f1;
            font-size: 14px;
            line-height: 1.6;
        }

        form {
            padding: 30px;
        }

        .section-title {
            font-size: 18px;
            color: #293b63;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e3e8f0;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label,
        .question {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .optional {
            color: #8992a4;
            font-weight: normal;
            font-size: 12px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dce7;
            border-radius: 7px;
            background: #fbfcfe;
            font-size: 14px;
            font-family: Arial, sans-serif;
            color: #283044;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #5579c7;
            box-shadow: 0 0 0 3px #5579c71a;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            margin: 0;
            cursor: pointer;
            line-height: 1.5;
        }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: #405e9e;
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .rating {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .rating label {
            flex: 1;
            text-align: center;
            border: 1px solid #d5dce7;
            border-radius: 7px;
            padding: 12px 5px;
            cursor: pointer;
            font-weight: normal;
        }

        .rating input {
            display: block;
            margin: 0 auto 8px;
            accent-color: #405e9e;
        }

        .rating label:has(input:checked) {
            background: #edf2ff;
            border-color: #405e9e;
            color: #293b63;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #293b63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #405e9e;
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #f7f8fb;
            color: #7b8497;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 5px auto;
            }

            .header {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 25px;
            }

            form {
                padding: 22px 18px;
            }

            .rating {
                gap: 5px;
            }

            .rating label {
                padding: 10px 3px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <span>We value your opinion</span>
            <h1>User Feedback Survey</h1>
            <p>
                Help us improve our services by sharing your
                experience. Your feedback matters to us!
            </p>
        </div>

        <form action="#" method="post">

            <h2 class="section-title">Personal Information</h2>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="age">Age Group</label>
                <select id="age" name="age" required>
                    <option value="">Select your age group</option>
                    <option>Under 18</option>
                    <option>18–25</option>
                    <option>26–35</option>
                    <option>36–50</option>
                    <option>Above 50</option>
                    <option>Prefer not to say</option>
                </select>
            </div>

            <h2 class="section-title">Your Experience</h2>

            <div class="form-group">
                <span class="question">1. How did you hear about us?</span>
                <div class="options">
                    <label><input type="radio" name="source" value="Social Media" required> Social Media</label>
                    <label><input type="radio" name="source" value="Friends"> Friends</label>
                    <label><input type="radio" name="source" value="Website"> Website</label>
                    <label><input type="radio" name="source" value="Other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <span class="question">2. Which features did you use?</span>
                <div class="options">
                    <label><input type="checkbox" name="features" value="Design"> Design</label>
                    <label><input type="checkbox" name="features" value="Services"> Services</label>
                    <label><input type="checkbox" name="features" value="Support"> Customer Support</label>
                    <label><input type="checkbox" name="features" value="Other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="satisfaction">3. How satisfied are you?</label>
                <select id="satisfaction" name="satisfaction" required>
                    <option value="">Choose your answer</option>
                    <option>Very Satisfied</option>
                    <option>Satisfied</option>
                    <option>Neutral</option>
                    <option>Dissatisfied</option>
                    <option>Very Dissatisfied</option>
                </select>
            </div>

            <div class="form-group">
                <span class="question">4. Rate your overall experience</span>
                <div class="rating">
                    <label><input type="radio" name="rating" value="1" required>1</label>
                    <label><input type="radio" name="rating" value="2">2</label>
                    <label><input type="radio" name="rating" value="3">3</label>
                    <label><input type="radio" name="rating" value="4">4</label>
                    <label><input type="radio" name="rating" value="5">5</label>
                </div>
            </div>

            <div class="form-group">
                <label for="improvement">5. What can we improve?</label>
                <select id="improvement" name="improvement">
                    <option value="">Select an option</option>
                    <option>Website Design</option>
                    <option>Service Quality</option>
                    <option>Customer Support</option>
                    <option>Loading Speed</option>
                    <option>Everything is good</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">
                    Additional Comments
                    <span class="optional">(Optional)</span>
                </label>
                <textarea id="message" name="message"
                          placeholder="Write your suggestions here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Feedback
            </button>

        </form>

    </div>

</body>
</html>
